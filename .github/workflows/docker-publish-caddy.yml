name: Build & publish Caddy image

# Builds Caddy.Dockerfile (Caddyfile + front-end statique déjà copiés
# dedans) et le pousse sur GitHub Container Registry, comme
# docker-publish.yml le fait pour l'API — le serveur OVH fait juste
# `docker compose --profile full pull`, pas besoin d'un checkout du dépôt
# à jour pour que le site soit servi. Voir docker-compose.yml et
# server/README.md "Déploiement (OVH)".
on:
  push:
    branches: [master]
    paths:
      - "*.dc.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "vendor/**"
      - "sitemap.xml"
      - "robots.txt"
      - "Caddyfile"
      - "Caddy.Dockerfile"
      - ".github/workflows/docker-publish-caddy.yml"

env:
  IMAGE: ghcr.io/nsapp44/nasap3d-caddy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Caddy.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
