name: Build & publish API image

# Builds server/Dockerfile (Node API + PrusaSlicer CLI + the Astro site,
# merged into one image — Caddy used to serve the site separately, see this
# workflow's own git history) and pushes it to GitHub Container Registry so
# the OVH server can `docker compose pull` instead of rebuilding on every
# deploy — see server/README.md "Déploiement (OVH)". Context is the repo
# root, not server/, since the Astro project lives there too.
on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker-publish.yml"

env:
  IMAGE: ghcr.io/nsapp44/nasap3d-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
