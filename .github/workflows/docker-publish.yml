name: Build & publish API image

# Builds Dockerfile (single Astro SSR app — API routes + the site + the
# PrusaSlicer CLI, all one image; the separate server/ backend and Caddy
# before it are both gone, see this workflow's own git history) and pushes
# it to GitHub Container Registry so the OVH server can `docker compose
# pull` instead of rebuilding on every deploy.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/**"
      - "prisma/**"
      - "bootstrap/**"
      - "slicer-profiles/**"
      - "server-entry.mjs"
      - "docker-entrypoint.sh"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"

env:
  IMAGE: ghcr.io/nsapp44/nasap3d-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Baked into the image and surfaced on GET /health — the fastest
          # way to confirm which build is actually running on the server
          # (`docker compose pull && up -d` doesn't always mean the
          # container actually restarted with the new image; this settles
          # it without guessing, see the mail-auth investigation this
          # session where "did the fix even deploy?" came up repeatedly).
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
