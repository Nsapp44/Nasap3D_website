name: Build & publish API image

# Builds server/Dockerfile (Node API + PrusaSlicer CLI) and pushes it to
# GitHub Container Registry so the OVH server can `docker compose pull`
# instead of rebuilding (npm install + PrusaSlicer AppImage download) on
# every deploy — see server/README.md "Déploiement (OVH)".
on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/docker-publish.yml"

env:
  IMAGE: ghcr.io/nsapp44/nasap3d-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
