# En local, tout fonctionne sans rien configurer (mot de passe par défaut,
# port DB accessible depuis l'hôte pour psql/Prisma Studio). En production,
# créer un `.env` à la racine du dépôt (à côté de ce fichier — pas
# server/.env) avec un vrai POSTGRES_PASSWORD ; voir .env.example.

# Docker's default json-file log driver never rotates: each container's
# log file grows forever on the host disk. During an outage the api logs a
# full stack trace on every failed health check (every 30s from the
# monitor), so a long outage slowly fills the VPS disk — and a full disk is
# itself something that takes Postgres down. 3 x 10MB per container caps it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # statement_timeout as a Prisma connection-string param (tried first,
    # on the api service's DATABASE_URL) does NOT do anything — confirmed
    # live: a query blocked on a table lock was still running 45s later,
    # never aborted, the whole request just hung. Setting it here instead
    # (server-wide, in ms, applies to every session on every database
    # regardless of client library) actually works — confirmed live: same
    # lock scenario, the blocked query now gets killed and the app recovers
    # on its own. This is the real fix for "one stuck query can silently
    # freeze the whole site with no crash and no restart" — see the api
    # service's own comment for the full incident this addresses.
    command: ["postgres", "-c", "statement_timeout=20000"]
    environment:
      POSTGRES_USER: nasap3d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nasap3d_dev_only}
      POSTGRES_DB: nasap3d
    ports:
      # Loopback uniquement (127.0.0.1) — jamais 0.0.0.0 : le mot de passe
      # par défaut ci-dessus est public (dans ce dépôt), donc exposer ce
      # port à tout Internet le rendrait attaquable directement. psql/Prisma
      # Studio depuis l'hôte marchent identiquement via 127.0.0.1:5432 ; ça
      # ne change rien en local, seulement en production sur un serveur avec
      # une IP publique.
      - "127.0.0.1:5432:5432"
    volumes:
      - nasap3d_db_data:/var/lib/postgresql/data
    networks:
      - nasap3d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasap3d -d nasap3d"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Pulled from GHCR by default (built by .github/workflows/docker-publish.yml
    # on every push to master) — `docker compose --profile full pull` on the
    # OVH server, no local build needed. `--build` (local dev) still works.
    # Single Astro SSR app now (see Dockerfile at the repo root) — no more
    # separate server/ backend, and no separate Caddy container/image either.
    image: ghcr.io/nsapp44/nasap3d-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Runs a tiny init (tini) as PID 1 instead of Node itself. Node as PID 1
    # never reaps orphaned grandchildren — confirmed live: the invoice PDF
    # worker chain (fork -> tsx -> worker -> esbuild) leaves zombie processes
    # behind that nothing ever cleans up for the life of the container.
    init: true
    depends_on:
      db:
        condition: service_healthy
    # Bind-mounted (not `env_file:`) so the app loads it itself via the
    # `dotenv` package (see server-entry.mjs's `import "dotenv/config"`,
    # already the same mechanism `npm run dev` uses locally) — dotenv
    # correctly strips quotes around values (KEY="value" -> value), unlike
    # Compose's own `env_file:`, which injects them into the container
    # environment completely as-is, quotes included. Confirmed in production:
    # a quoted S3_REGION broke the AWS SDK with a doubly-quoted region string.
    volumes:
      - ./.env:/app/.env:ro
      # Local-disk fallback storage (src/lib/server/storage.ts, used whenever
      # S3 isn't configured) writes to ./uploads relative to the container's
      # WORKDIR (/app) — quote STL/STEP files, contact attachments, generated
      # invoice PDFs. Without a named volume here, that directory lives only
      # in the container's own writable layer and is wiped on every
      # redeploy (a new container replaces the old one) — confirmed in
      # production: a quote file 404'd after a routine redeploy for an
      # unrelated fix. This survives redeploys the same way nasap3d_db_data
      # already does for Postgres; only `docker compose down -v` removes it.
      - nasap3d_uploads_data:/app/uploads
    environment:
      # connection_limit/pool_timeout are set explicitly (real, documented
      # Prisma Postgres-connector URL params) — without them, Prisma sizes
      # its pool off the host's visible CPU count (num_physical_cpus*2+1),
      # the same kind of hardware-derived sizing that already caused a real
      # bug elsewhere in this app (see LESSONS_LEARNED.md) and is
      # meaningless on a small, RAM-constrained VPS. The actual fix for "a
      # stuck query hangs forever and eventually freezes the whole site" is
      # the db service's own statement_timeout, not anything here — see its
      # comment for why (this same statement_timeout, tried as a query-
      # string param here first, silently did nothing).
      DATABASE_URL: postgresql://nasap3d:${POSTGRES_PASSWORD:-nasap3d_dev_only}@db:5432/nasap3d?connection_limit=10&pool_timeout=10
      # .env.example defaults to NODE_ENV=development (for `npm run dev`) —
      # env_file above would otherwise silently override the Dockerfile's
      # own `ENV NODE_ENV=production` with that dev value at container start
      # (runtime env always wins over an image's baked-in ENV). This profile
      # ("full") is the production/OVH deployment, so it must always be
      # "production" here regardless of .env — this gates the hCaptcha
      # fail-closed behavior and the Secure cookie flag (see
      # src/lib/server/captcha.ts, src/lib/server/session.ts,
      # src/lib/api/cookies.ts).
      NODE_ENV: production
    ports:
      # Loopback uniquement — useful for local dev/debugging directly against
      # the container. In production, the reverse proxy already running on
      # the OVH host (a separate tool, handles TLS) reaches this container by
      # its Docker DNS name on the "nasap3d_network" below (api:3000), the
      # same way it used to reach caddy:80 — not through this published port,
      # which stays loopback-only so :3000 is never exposed to the internet
      # directly, unauthenticated, without TLS.
      - "127.0.0.1:3000:3000"
    networks:
      - nasap3d
    profiles:
      - full

  monitor:
    # Same image as api, different entrypoint — deliberately its own
    # container rather than a background task inside api's own process: if
    # api crashes/OOMs, a watchdog living inside that same process would die
    # with it and could never send the alert it exists for. This one keeps
    # polling GET /api/health over the internal network and can still reach
    # out over SMTP even while api itself is down. See healthMonitor.mts for
    # the alerting logic (one email when it goes down, one when it recovers
    # — never a fresh email every 30s while it stays down).
    image: ghcr.io/nsapp44/nasap3d-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    init: true
    depends_on:
      - api
    volumes:
      - ./.env:/app/.env:ro
    environment:
      NODE_ENV: production
    entrypoint: ["npx", "tsx", "src/lib/server/healthMonitor.mts"]
    networks:
      - nasap3d
    profiles:
      - full

networks:
  # Nommé explicitement (au lieu du nom par défaut généré par Compose à
  # partir du dossier, ex. "refontenasap3d_default") pour qu'un autre projet
  # docker-compose (le reverse proxy du serveur) puisse le rejoindre de
  # façon fiable en le déclarant "external: true" sous ce même nom, et
  # atteindre ce conteneur par le nom de service Docker ("api"), sur le
  # port 3000 interne (jamais exposé publiquement à l'hôte).
  nasap3d:
    name: nasap3d_network

volumes:
  nasap3d_db_data:
  nasap3d_uploads_data:
