# En local, tout fonctionne sans rien configurer (mot de passe par défaut,
# port DB accessible depuis l'hôte pour psql/Prisma Studio). En production,
# créer un `.env` à la racine du dépôt (à côté de ce fichier — pas
# server/.env) avec un vrai POSTGRES_PASSWORD ; voir .env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nasap3d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nasap3d_dev_only}
      POSTGRES_DB: nasap3d
    ports:
      # Loopback uniquement (127.0.0.1) — jamais 0.0.0.0 : le mot de passe
      # par défaut ci-dessus est public (dans ce dépôt), donc exposer ce
      # port à tout Internet le rendrait attaquable directement. psql/Prisma
      # Studio depuis l'hôte marchent identiquement via 127.0.0.1:5432 ; ça
      # ne change rien en local, seulement en production sur un serveur avec
      # une IP publique.
      - "127.0.0.1:5432:5432"
    volumes:
      - nasap3d_db_data:/var/lib/postgresql/data
    networks:
      - nasap3d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasap3d -d nasap3d"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Pulled from GHCR by default (built by .github/workflows/docker-publish.yml
    # on every push to master) — `docker compose --profile full pull` on the
    # OVH server, no local build needed. `--build` (local dev) still works.
    # Context is the repo root, not ./server: this image now also builds and
    # serves the Astro site (see server/Dockerfile's web-build stage) — Caddy
    # (a separate container/image, previously) is gone entirely.
    image: ghcr.io/nsapp44/nasap3d-api:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Bind-mounted (not `env_file:`) so the app loads it itself via the
    # `dotenv` package (see server/src/index.ts's `import "dotenv/config"`,
    # already the same mechanism `npm run dev` uses locally) — dotenv
    # correctly strips quotes around values (KEY="value" -> value), unlike
    # Compose's own `env_file:`, which injects them into the container
    # environment completely as-is, quotes included. Confirmed in production:
    # a quoted S3_REGION broke the AWS SDK with a doubly-quoted region string.
    volumes:
      - ./server/.env:/app/.env:ro
    environment:
      DATABASE_URL: postgresql://nasap3d:${POSTGRES_PASSWORD:-nasap3d_dev_only}@db:5432/nasap3d
      # server/.env's PRUSASLICER_BIN is the Windows dev path (for `npm run
      # dev` outside Docker) — override it here so the container always
      # uses the Linux binary server/Dockerfile actually installs, no
      # matter what's in the .env file used for local dev.
      PRUSASLICER_BIN: /usr/local/bin/prusa-slicer
      # server/.env.example defaults to NODE_ENV=development (for `npm run
      # dev`) — env_file above would otherwise silently override the
      # Dockerfile's own `ENV NODE_ENV=production` with that dev value at
      # container start (runtime env always wins over an image's baked-in
      # ENV). This profile ("full") is the production/OVH deployment, so it
      # must always be "production" here regardless of server/.env — this
      # gates the hCaptcha fail-closed behavior and the Secure cookie flag
      # (see src/lib/captcha.ts, session.ts, guestSession.ts).
      NODE_ENV: production
    ports:
      # Loopback uniquement — useful for local dev/debugging directly against
      # the container. In production, the reverse proxy already running on
      # the OVH host (a separate tool, handles TLS) reaches this container by
      # its Docker DNS name on the "nasap3d_network" below (api:3000), the
      # same way it used to reach caddy:80 — not through this published port,
      # which stays loopback-only so :3000 is never exposed to the internet
      # directly, unauthenticated, without TLS.
      - "127.0.0.1:3000:3000"
    networks:
      - nasap3d
    profiles:
      - full

networks:
  # Nommé explicitement (au lieu du nom par défaut généré par Compose à
  # partir du dossier, ex. "refontenasap3d_default") pour qu'un autre projet
  # docker-compose (le reverse proxy du serveur) puisse le rejoindre de
  # façon fiable en le déclarant "external: true" sous ce même nom, et
  # atteindre ce conteneur par le nom de service Docker ("api"), sur le
  # port 3000 interne (jamais exposé publiquement à l'hôte).
  nasap3d:
    name: nasap3d_network

volumes:
  nasap3d_db_data:
