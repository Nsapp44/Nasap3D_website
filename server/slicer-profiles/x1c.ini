# Bambu Lab X1C — profil de base (voir README.md de ce dossier)
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4,0.4,0.4,0.4,0.4
gcode_flavor = marlin2

# Vitesses approchant une CoreXY rapide (X1C) — PrusaSlicer part par défaut de
# vitesses ~60-80mm/s (imprimantes bien plus lentes), ce qui donnait des temps
# estimés x5-10 trop longs par rapport à la réalité. Valeurs à affiner avec un
# vrai calibrage de vos machines quand vous aurez le temps.
perimeter_speed = 200
external_perimeter_speed = 150
small_perimeter_speed = 100
infill_speed = 300
solid_infill_speed = 250
top_solid_infill_speed = 200
gap_fill_speed = 150
bridge_speed = 50
first_layer_speed = 50
travel_speed = 400
max_print_speed = 300
default_acceleration = 4000
perimeter_acceleration = 4000
infill_acceleration = 5000
travel_acceleration = 8000
